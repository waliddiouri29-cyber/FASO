name: build-apk
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Générer le dossier Android
        run: |
          flutter create --org com.faso --project-name faso --platforms=android /tmp/shell
          cp -r /tmp/shell/android ./android
      - name: Permissions micro et internet
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries><application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: faso-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
